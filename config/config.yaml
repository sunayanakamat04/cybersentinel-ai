system:
  app_name: "CyberSentinel AI"
  version: "0.1.0"
  environment: "development"
  log_level: "INFO"
  seed: 42

dataset:
  name: "CIC-IDS2017"
  target_column: "Label"
  benign_label: "BENIGN"
  key_flow_features:
    - "Destination Port"
    - "Flow Duration"
    - "Total Fwd Packets"
    - "Total Backward Packets"
    - "Total Length of Fwd Packets"
    - "Total Length of Bwd Packets"
    - "Fwd Packet Length Max"
    - "Fwd Packet Length Min"
    - "Fwd Packet Length Mean"
    - "Fwd Packet Length Std"
    - "Bwd Packet Length Max"
    - "Bwd Packet Length Min"
    - "Bwd Packet Length Mean"
    - "Bwd Packet Length Std"
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Flow IAT Min"
    - "Fwd IAT Total"
    - "Bwd IAT Total"
    - "Fwd PSH Flags"
    - "Bwd PSH Flags"
    - "Fwd URG Flags"
    - "Bwd URG Flags"
    - "Fwd Header Length"
    - "Bwd Header Length"
    - "Fwd Packets/s"
    - "Bwd Packets/s"
    - "Min Packet Length"
    - "Max Packet Length"
    - "Packet Length Mean"
    - "Packet Length Std"
    - "Packet Length Variance"
    - "FIN Flag Count"
    - "SYN Flag Count"
    - "RST Flag Count"
    - "PSH Flag Count"
    - "ACK Flag Count"
    - "URG Flag Count"
    - "Down/Up Ratio"
    - "Average Packet Size"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"
    - "act_data_pkt_fwd"
    - "min_seg_size_forward"
    - "Active Mean"
    - "Active Std"
    - "Idle Mean"
    - "Idle Std"

models:
  supervised:
    type: "xgboost"
    model_path: "models/xgboost_classifier_v1.joblib"
    params:
      n_estimators: 150
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "multi:softprob"
      eval_metric: "mlogloss"
      random_state: 42
    attack_classes:
      0: "BENIGN"
      1: "DoS_Hulk"
      2: "PortScan"
      3: "DDoS"
      4: "DoS_GoldenEye"
      5: "FTP-Patator"
      6: "SSH-Patator"
      7: "DoS_slowloris"
      8: "DoS_Slowhttptest"
      9: "Botnet"
      10: "Web_Attack_Brute_Force"
      11: "Web_Attack_XSS"
      12: "Infiltration"

  unsupervised:
    type: "isolation_forest"
    model_path: "models/isolation_forest_v1.joblib"
    params:
      n_estimators: 100
      contamination: 0.05
      max_samples: 256
      random_state: 42
    score_threshold: 0.65

explainability:
  method: "shap"
  explainer_type: "TreeExplainer"
  top_k_features: 5
  cache_background_samples: 100

drift:
  metrics:
    - "kolmogorov_smirnov"
    - "population_stability_index"
  window_size: 1000
  ks_p_value_threshold: 0.05
  psi_threshold: 0.20
  critical_features:
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Flow Duration"
    - "Packet Length Mean"
    - "Total Fwd Packets"
