<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberSentinel AI | Network Intrusion Detection{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bs-body-bg: #0b0f19;
            --bs-body-color: #cbd5e1;
            --cyber-card-bg: #111827;
            --cyber-border: #1f2937;
            --cyber-accent: #06b6d4;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
        .navbar-cyber {
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--cyber-border);
        }
        .card-cyber {
            background-color: var(--cyber-card-bg);
            border: 1px solid var(--cyber-border);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .badge-critical { background-color: #dc3545; color: #fff; }
        .badge-high { background-color: #fd7e14; color: #fff; }
        .badge-medium { background-color: #ffc107; color: #000; }
        .badge-low { background-color: #0dcaf0; color: #000; }
        .badge-info { background-color: #6c757d; color: #fff; }
        .table-cyber {
            --bs-table-bg: transparent;
            --bs-table-border-color: var(--cyber-border);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-cyber sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-info" href="/">
                <i class="bi bi-shield-lock-fill me-2"></i>CyberSentinel AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs" target="_blank"><i class="bi bi-code-slash me-1"></i> API Docs</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                        <i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i> System Active
                    </span>
                    <span class="text-secondary small">v0.1.0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4 px-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 px-4 border-top border-secondary text-secondary small text-center">
        CyberSentinel AI • Adaptive Network Intrusion Detection System • Decision-Support Architecture
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
